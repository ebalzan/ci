# =============================================================================
# Deploy — what ships a release of THIS repo. Yours to edit.
#
# release.yml calls it with the new tag after every release. Run it by hand
# (Actions → Deploy → Run workflow) to redeploy any tag, or to roll back to an
# older one.
#
# Permissions: on a release, the `deploy` job of release.yml grants them
# (contents: read, id-token: write, packages: write, deployments: write); add
# there what this file needs beyond that. Secrets: all of the repo's, and the
# `production` environment's.
#
# The `production` environment: required reviewers and environment secrets
# work. Do not limit it to the main branch: a release's run has the ref
# refs/pull/<n>/merge (it starts from the merged PR), so it would be refused.
# Generated by `ebalzan-ci onboard`; `--force` would replace it.
# =============================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: __RUNS_ON__
    environment: production
    # One deploy at a time, never cancelled half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
        run: echo "Nothing to deploy yet for $TAG — replace this step."

      # Examples — keep what fits, drop the rest.
      #
      # An npm package (trusted publishing, no token: the job needs
      # id-token: write):
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 24
      #     registry-url: https://registry.npmjs.org
      # - run: npm ci
      # - run: npm publish --provenance --access public
      #
      # A container image on GHCR (packages: write):
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ github.token }}
      # - uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
      #
      # A Vercel production deploy (VERCEL_TOKEN, VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID as secrets):
      # - run: npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN"
      #   env:
      #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
