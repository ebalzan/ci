# =============================================================================
# Deploy — what ships a release of THIS repo. Yours to edit.
#
# release.yml calls it with the new tag after every release. Run it by hand
# (Actions → Deploy → Run workflow) to redeploy any tag, or to roll back to an
# older one.
#
# Permissions: the block below, for a run by hand. On a release, the `deploy`
# job of release.yml grants them and this file may not ask for more — change
# both together. Secrets: all of the repo's, and the `production` environment's.
#
# The `production` environment: required reviewers and environment secrets
# work. Do not limit it to the main branch: a release's run has the ref
# refs/pull/<n>/merge (it starts from the release PR's event), so it would be
# refused.
# Generated by `ebalzan-ci onboard`, which never overwrites it (not even with
# --force): changes here are yours to keep.
# =============================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true

# Same as the `deploy` job of release.yml.
permissions:
  contents: read
  id-token: write
  packages: write
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: __RUNS_ON__
    environment: production
    # One deploy at a time, never cancelled half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The tag's code, and the Node of its .nvmrc or .node-version (else 26).
      # Any input of actions/checkout (checkout-*) or actions/setup-node
      # (node-*) can be set here, e.g. checkout-persist-credentials: true for
      # a deploy that pushes (gh-pages).
      - uses: __CI_REPO__/actions/setup@__CI_REF__
        with:
          checkout-ref: ${{ inputs.tag }}

      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
        run: echo "Nothing to deploy yet for $TAG — replace this step."

      # Examples — keep what fits, drop the rest.
      #
      # An npm package (trusted publishing, no token: the job needs
      # id-token: write). Add to the setup step's `with:`:
      #     node-registry-url: https://registry.npmjs.org
      # then:
      # - run: npm ci
      # - run: npm publish --provenance --access public
      #
      # A container image on GHCR (packages: write):
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ github.token }}
      # - uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
      #
      # A Vercel production deploy (VERCEL_TOKEN, VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID as secrets):
      # - run: npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN"
      #   env:
      #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
