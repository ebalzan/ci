# =============================================================================
# Promote dev → main — keeps ONE evergreen dev → main PR open.
#
# Every push to dev opens or updates it, titled with the release it will cut
# (e.g. `feat: promote dev to main (v1.4.0)`). Merging it (squash) is the
# release approval. Generated by `ebalzan-ci onboard`; logic in __CI_REPO__.
# =============================================================================
name: Promote dev to main

on:
  push:
    branches: ['dev']
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  promote:
    uses: __CI_REPO__/.github/workflows/promote-dev-to-main.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
