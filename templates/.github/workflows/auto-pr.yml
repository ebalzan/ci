# =============================================================================
# Auto Create Work Items — thin caller of __CI_REPO__'s shared workflow.
#
# On every push to a work branch (feat/…, fix/…, …) it creates or updates the
# tracking issue, the PR into dev and, when AUTO_PROJECT_NUMBER is set, the
# Projects (v2) card. Generated by `ebalzan-ci onboard`; the logic lives in
# __CI_REPO__ (docs/AUTO_WORK_ITEMS_WORKFLOW.md), so this file only holds what
# cannot live there: the trigger, the permissions and the secrets.
# =============================================================================
name: Auto Create Work Items

on:
  push:
    branches-ignore:
      - main
      - dev
    tags-ignore:
      - '**'

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  work-items:
    uses: __CI_REPO__/.github/workflows/auto-work-items.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
