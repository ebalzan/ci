# =============================================================================
# Auto PR — runs __CI_REPO__'s auto-pr action.
#
# On every push to a work branch (feat/…, fix/…, …) it opens or updates the PR
# into dev: type label, assignee, the AUTO_MILESTONE_TITLE milestone and the
# AUTO_PROJECT_NUMBER board when set, and an AI-written description. No issue
# is created. On every push to dev it opens or updates THE release PR, dev →
# main, titled after the release it will cut (e.g. `feat: release v1.4.0`).
# Generated by `ebalzan-ci onboard`; the logic lives in the action (it follows
# __CI_REF__), so this file only holds the trigger, the permissions, the
# checkout and the secrets. Refresh it with `ebalzan-ci onboard --force
# .github/workflows/auto-pr.yml`.
# =============================================================================
name: Auto PR

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Open or update PR
    # Renovate opens and rewrites its own PR on these branches.
    if: ${{ !startsWith(github.ref_name, 'chore/renovate-') }}
    runs-on: __RUNS_ON__
    # Queued, never cancelled: a run cut short could leave its new PR in draft.
    concurrency:
      group: auto-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      AUTO_BASE_BRANCH: dev
      AUTO_RELEASE_BRANCH: main
      REPO_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      # Full history with the tags: the release PR's version comes from them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: __CI_REPO__/actions/auto-pr@__CI_REF__
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
