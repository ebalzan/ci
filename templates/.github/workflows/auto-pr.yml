# =============================================================================
# Auto PR — thin caller of __CI_REPO__'s shared workflow.
#
# On every push to a work branch (feat/…, fix/…, …) it opens or updates the PR
# into dev: type label, assignee, the AUTO_MILESTONE_TITLE milestone and the
# AUTO_PROJECT_NUMBER board when set, and an AI-written description. No issue
# is created. Generated by `ebalzan-ci onboard`; the logic lives in
# __CI_REPO__, so this file only holds what cannot live there: the trigger,
# the permissions and the secrets.
# =============================================================================
name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - dev
    tags-ignore:
      - '**'

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    uses: __CI_REPO__/.github/workflows/auto-pr.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
