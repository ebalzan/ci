# =============================================================================
# PR Checks — the quality gate for every PR into dev or main.
#
#   title   The shared PR-title check (__CI_REPO__): the title must be a
#           Conventional Commit whose type matches the branch prefix. Keep the
#           job id `title`: the check is reported as `title / Validate PR Title`,
#           the name the shared rulesets require.
#
# Add this repo's own build/test/lint jobs below; they run in parallel.
# Generated by `ebalzan-ci onboard`.
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: ['main', 'dev']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    uses: __CI_REPO__/.github/workflows/pr-title.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__

