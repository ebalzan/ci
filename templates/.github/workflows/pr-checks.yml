# =============================================================================
# PR Checks — the quality gate for every PR into dev or main.
#
#   title   The shared PR-title check (__CI_REPO__): the title must be a
#           Conventional Commit whose type matches the branch prefix. Keep the
#           job id `title`: the check is reported as `title / Validate PR Title`,
#           the name the shared rulesets require.
#
# Add this repo's own build/test/lint jobs below; they run in parallel.
# Generated by `ebalzan-ci onboard`.
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: ['main', 'dev']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    uses: __CI_REPO__/.github/workflows/pr-title.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__

  # A Node repo's own checks. Uncomment and adapt; other stacks replace the
  # steps (e.g. `go test ./...`).
  # validate:
  #   name: Validate
  #   runs-on: __RUNS_ON__
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - run: npm ci
  #     # Prettier/ESLint/TypeScript extend @ebalzan/config instead of copying it.
  #     - run: npx --no-install ebalzan-config verify
  #     # The repo's own script: format:check, lint, typecheck, test, …
  #     - run: npm run validate
