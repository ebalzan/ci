# =============================================================================
# PR Checks — the quality gate for every PR into dev or main.
#
#   pr-check  The shared PR check (__CI_REPO__), one job per PR kind:
#             `Work PR` for feat/fix/… PRs into dev — Conventional title and
#             commits, then the PR's data: branch, title type, type label,
#             assignee, author, milestone, board, description. `Release PR`
#             for the dev → main PR — the same commitlint steps, the computed
#             `<type>[!]: release vX.Y.Z` title, the `release` label, assignee,
#             milestone, board, description. The other job is skipped, as are
#             drafts. Keep the job id `pr-check`: the checks are reported as
#             `pr-check / Work PR` and `pr-check / Release PR`, the names the
#             shared rulesets require.
#
# The PR's metadata is part of the check, so it also re-runs when the title,
# description, labels, milestone or assignees change.
# Add this repo's own build/test/lint jobs below; they run in parallel.
# Generated by `ebalzan-ci onboard`.
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: ['main', 'dev']
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
      - unassigned

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: __CI_REPO__/.github/workflows/pr-check.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

  # A Node repo's own checks. Uncomment and adapt; other stacks replace the
  # steps (e.g. `go test ./...`).
  # validate:
  #   name: Validate
  #   runs-on: __RUNS_ON__
