# =============================================================================
# PR Checks — the quality gate for every PR into dev or main.
#
#   pr-check / Work PR     __CI_REPO__'s pr-checks action for feat/fix/… PRs
#                          into dev — Conventional title and commits, then the
#                          PR's data: branch, title type, type label, assignee,
#                          author, milestone, board, description.
#   pr-check / Release PR  The same action for the dev → main PR — the same
#                          commitlint steps, the computed
#                          `<type>[!]: release vX.Y.Z` title, the `release`
#                          label, assignee, milestone, board, description.
#
# The other kind is skipped, as are drafts. Keep the two job names as they are:
# they are the check names the shared rulesets require.
#
# The PR's metadata is part of the check, so it also re-runs when someone changes
# the title, description, labels, milestone or assignees. Auto PR's own edits
# start no run: on a push or a new PR, the one run waits for Auto PR to finish.
# One exception: adding `ship` to the release PR starts the Release workflow,
# which reads the result its head already has, so these jobs skip that one event.
# GitHub cannot filter a trigger by label name, and those runs get a concurrency
# group of their own, so they never cancel a real check. Every other event runs
# as usual, removing `ship` included.
# Add this repo's own build/test/lint jobs below; they run in parallel. Give each
# one the same condition as the release-pr job.
# Generated by `ebalzan-ci onboard`; the check logic lives in the action (it
# follows __CI_REF__).
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: ['main', 'dev']
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
      - unassigned

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name == 'ship' && github.event.pull_request.head.ref == 'dev' && '-ship' || '' }}
  cancel-in-progress: true

env:
  AUTO_BASE_BRANCH: dev
  AUTO_RELEASE_BRANCH: main
  REPO_VARS_JSON: ${{ toJSON(vars) }}

jobs:
  work-pr:
    name: pr-check / Work PR
    if: ${{ github.event.pull_request.head.ref != 'dev' && !github.event.pull_request.draft }}
    runs-on: __RUNS_ON__
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: __CI_REPO__/actions/pr-checks@__CI_REF__
        with:
          kind: work
          project-token: ${{ secrets.GH_PROJECT_TOKEN }}

  release-pr:
    name: pr-check / Release PR
    if: ${{ github.event.pull_request.head.ref == 'dev' && !github.event.pull_request.draft && !(github.event.action == 'labeled' && github.event.label.name == 'ship') }}
    runs-on: __RUNS_ON__
    steps:
      # Full history with the tags: git-cliff computes the version from them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: __CI_REPO__/actions/pr-checks@__CI_REF__
        with:
          kind: release
          project-token: ${{ secrets.GH_PROJECT_TOKEN }}

  # A Node repo's own checks. Uncomment and adapt; other stacks replace the
  # steps (e.g. `go test ./...`).
  # validate:
  #   name: Validate
  #   if: ${{ !github.event.pull_request.draft && !(github.event.action == 'labeled' && github.event.label.name == 'ship' && github.event.pull_request.head.ref == 'dev') }}
  #   runs-on: __RUNS_ON__
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - run: npm ci
  #     # Prettier/ESLint/TypeScript extend @ebalzan/config instead of copying it.
  #     - run: npx --no-install ebalzan-config verify
  #     # The repo's own script: format:check, lint, typecheck, test, …
  #     - run: npm run validate
