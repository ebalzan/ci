# =============================================================================
# PR Checks — the quality gate for every PR into dev or main.
#
#   work-pr   The shared work-PR check (__CI_REPO__) for feat/fix/… PRs into
#             dev: Conventional title and commits, then the PR's data — branch,
#             title type, type label, assignee, author, milestone, board,
#             description. Skipped for drafts and for the dev → main release
#             PR. Keep the job id `work-pr`: the check is reported as
#             `work-pr / Work PR`, the name the shared rulesets require.
#
# The PR's metadata is part of the check, so it also re-runs when the title,
# description, labels, milestone or assignees change.
# Add this repo's own build/test/lint jobs below; they run in parallel.
# Generated by `ebalzan-ci onboard`.
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: ['main', 'dev']
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
      - unassigned

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  work-pr:
    uses: __CI_REPO__/.github/workflows/work-pr.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

  # A Node repo's own checks. Uncomment and adapt; other stacks replace the
  # steps (e.g. `go test ./...`).
  # validate:
  #   name: Validate
  #   runs-on: __RUNS_ON__
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - run: npm ci
  #     # Prettier/ESLint/TypeScript extend @ebalzan/config instead of copying it.
  #     - run: npx --no-install ebalzan-config verify
  #     # The repo's own script: format:check, lint, typecheck, test, …
  #     - run: npm run validate
