# =============================================================================
# Release — thin caller of __CI_REPO__'s shared workflow.
#
# Runs when a PR into main is closed; the shared job releases only when it is
# the dev → main release PR and it was merged (with a merge commit). Merging a
# work PR into dev never runs it. The release: the version from the
# Conventional Commits since the last tag, package.json bumped when there is
# one, the vX.Y.Z tag, the GitHub Release (the PR's description as notes), and
# dev brought up to main.
#
# Then `deploy` hands the new tag to deploy.yml — this repo's own file, where
# what ships the release lives. Generated by `ebalzan-ci onboard`; keep
# deploying out of this file.
# =============================================================================
name: Release

on:
  pull_request:
    types: [closed]
    branches: ['main']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: __CI_REPO__/.github/workflows/release.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

  deploy:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    # What deploy.yml may use: a called workflow gets at most what this job
    # grants. Keep it equal to deploy.yml's own `permissions` (e.g. add
    # attestations: write to both).
    permissions:
      contents: read
      id-token: write
      packages: write
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
