# =============================================================================
# Release — every push to main becomes a versioned release.
#
# The shared job computes the next semver from the Conventional Commits since
# the last tag, bumps package.json when there is one, tags vX.Y.Z, creates the
# GitHub Release and points dev at the release commit. Generated by
# `ebalzan-ci onboard`; logic in __CI_REPO__ (docs/CI_FLOW.md).
#
# Shipping is this repo's business: chain jobs on the outputs. `tag` is empty
# when nothing was released (the release commit's own run).
# =============================================================================
name: Release

on:
  push:
    branches: ['main']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: __CI_REPO__/.github/workflows/release.yml@__CI_REF__
    with:
      runs-on: __RUNS_ON__

