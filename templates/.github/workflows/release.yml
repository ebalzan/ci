# =============================================================================
# Release — runs __CI_REPO__'s release action.
#
# Runs when a PR into main is closed; the `release` job runs only when it is
# the dev → main release PR and it was merged (with a merge commit). Merging a
# work PR into dev never runs it. The release: the version from the
# Conventional Commits since the last tag, package.json bumped when there is
# one, the vX.Y.Z tag, the GitHub Release (the PR's description as notes), and
# dev brought up to main.
#
# Then `deploy` hands the new tag to deploy.yml — this repo's own file, where
# what ships the release lives. Generated by `ebalzan-ci onboard`; the release
# logic lives in the action (it follows __CI_REF__). Keep deploying out of this
# file.
# =============================================================================
name: Release

on:
  pull_request:
    types: [closed]
    branches: ['main']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Version, tag and publish
    if: >-
      ${{ github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'dev'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: __RUNS_ON__
    # Queued, never cancelled: a run cut short could tag without a Release.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      AUTO_BASE_BRANCH: dev
      AUTO_RELEASE_BRANCH: main
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # The merge commit, with full history and the tags: git-cliff computes the
      # version from them. Credentials stay: the job pushes main and dev.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        uses: __CI_REPO__/actions/release@__CI_REF__
        with:
          dev-token: ${{ secrets.GH_PROJECT_TOKEN }}

  deploy:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    # What deploy.yml may use: a called workflow gets at most what this job
    # grants. Keep it equal to deploy.yml's own `permissions` (e.g. add
    # attestations: write to both).
    permissions:
      contents: read
      id-token: write
      packages: write
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
