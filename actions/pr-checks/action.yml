# The PR check: what a PR must look like before it is merged, for both kinds
# actions/auto-pr opens — a work PR (feat/fix/… → dev, squash-merged) and the
# release PR (dev → main, shipped by fast-forward). Three steps, each
# reported on its own in the job log; all three run even when one fails, so one
# push shows everything to fix:
#
#   Conventional title    commitlint on the PR title — a work PR's becomes its
#                         squash commit on dev, which drives the release.
#   Conventional commits  commitlint on every commit of the PR — a work PR's
#                         squash commit lists them in its body (repo setting
#                         squash_merge_commit_message = COMMIT_MESSAGES); the
#                         release PR's are dev's commits, which main
#                         fast-forwards to as they are.
#   PR metadata           Danger (dangerfile.mjs → work-pr/rules.mjs or
#                         release-pr/rules.mjs, both on rules.mjs). Work PR: base
#                         branch, branch name, title type = branch type, type
#                         label, assignee, author, milestone, project board,
#                         description; warnings for size, major release, behind
#                         base. Release PR: base branch, the exact title
#                         scripts/release-title.mjs computes (git-cliff), the
#                         `release` label, assignee, milestone, board,
#                         description, dev not behind main and without merge
#                         commits; a warning for a major release, and once it
#                         passes, how to ship it (the `ship` label). Posts one PR
#                         comment listing them.
#
# Renovate's PRs (chore/renovate-*) get the two commitlint steps only: Renovate
# opens and rewrites them itself, with no board, milestone or AI description.
#
# Needs a full-history checkout of the PR head, Node, and the job env
# REPO_VARS_JSON (the caller's `vars`); AUTO_BASE_BRANCH and AUTO_RELEASE_BRANCH
# default to dev and main (scripts/shared-vars.mjs).
# Used by templates/.github/workflows/pr-checks.yml (onboarded repos).
name: PR Check
description: Validate a work PR or the release PR — title, commits and PR metadata.
inputs:
  kind:
    description: work (feat/fix/… → dev) or release (dev → main).
    default: work
  github-token:
    description: Token for Danger's PR comment (pull-requests write).
    default: ${{ github.token }}
  project-token:
    description: Token that can read the Projects (v2) board — a classic PAT with the project scope for a board owned by a personal account. Defaults to github-token.
    default: ''
runs:
  using: composite
  steps:
    - name: Install commitlint, Danger and git-cliff
      id: install
      shell: bash
      run: |
        CI_ROOT="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        echo "CI_ROOT=$CI_ROOT" >> "$GITHUB_ENV"
        npm ci --ignore-scripts --no-audit --no-fund --prefix "$CI_ROOT"
        node "$CI_ROOT/scripts/shared-vars.mjs"

    - name: Conventional title
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: printf '%s\n' "$PR_TITLE" | bash "$CI_ROOT/scripts/commitlint.sh"

    - name: Conventional commits
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$CI_ROOT/scripts/commitlint.sh" --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

    - name: PR metadata
      if: ${{ !cancelled() && steps.install.outcome == 'success' && !startsWith(github.event.pull_request.head.ref, 'chore/renovate-') }}
      shell: bash
      env:
        PR_KIND: ${{ inputs.kind }}
        DANGER_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        PROJECT_TOKEN: ${{ inputs.project-token || inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        BEHIND_BY="$(git rev-list --count "$HEAD_SHA..origin/$BASE_REF" 2>/dev/null || echo 0)"
        MERGE_COMMITS="$(git rev-list --merges --count "origin/$BASE_REF..$HEAD_SHA" 2>/dev/null || echo 0)"
        export BEHIND_BY MERGE_COMMITS
        if [ "$PR_KIND" = release ]; then
          RELEASE_TITLE="$(node "$CI_ROOT/scripts/release-title.mjs")"
          export RELEASE_TITLE
        fi
        "$CI_ROOT/node_modules/.bin/danger" ci \
          --dangerfile "$GITHUB_ACTION_PATH/dangerfile.mjs" \
          --id "$PR_KIND-pr" --failOnErrors --no-publish-check
