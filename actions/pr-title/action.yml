# The PR title becomes the squash commit that drives the semver release, so it
# must be a Conventional Commit subject whose type matches the branch prefix.
#
# Also fails when the caller keeps a LOCAL COPY of a managed/ file and it
# differs from this version's (bin/sync-managed.sh) — the husky commit-msg hook
# runs that copy, so drift would let a commit pass locally that CI rejects.
# A repo that keeps no copy (its hook runs `ebalzan-ci commit-msg` from the npm
# package) is fine; local copies are deprecated.
# The caller must have checked out the managed paths (sparse is enough).
name: PR title
description: Validate a PR title against Conventional Commits and the branch release type.
inputs:
  title:
    description: The pull request title.
    required: true
  head-ref:
    description: The pull request head branch.
    required: true
runs:
  using: composite
  steps:
    - name: Validate PR title
      shell: sh
      env:
        PR_TITLE: ${{ inputs.title }}
        CI_ROOT: ${{ github.action_path }}/../..
      run: sh "$CI_ROOT/managed/scripts/release/validate-conventional-subject.sh" "$PR_TITLE" "pull request title"

    - name: Verify PR title matches branch release type
      shell: sh
      env:
        PR_HEAD_REF: ${{ inputs.head-ref }}
        PR_TITLE: ${{ inputs.title }}
        CI_ROOT: ${{ github.action_path }}/../..
      run: node "$CI_ROOT/scripts/release/verify-pr-release-type.mjs"

    - name: Verify managed files are in sync
      shell: bash
      env:
        CI_ROOT: ${{ github.action_path }}/../..
      run: |
        drift=0
        while IFS= read -r rel; do
          [ -f "$GITHUB_WORKSPACE/$rel" ] || continue
          if ! cmp -s "$CI_ROOT/managed/$rel" "$GITHUB_WORKSPACE/$rel"; then
            echo "::error file=$rel::$rel differs from ebalzan/ci's managed copy. Delete the copy and have the husky hook run 'npx --no-install ebalzan-ci commit-msg \"\$1\"' (recommended), or refresh it with 'npx ebalzan-ci sync-managed --install' and commit the result."
            drift=1
          fi
        done < <(cd "$CI_ROOT/managed" && find . -type f | sed 's#^\./##' | sort)
        exit "$drift"
