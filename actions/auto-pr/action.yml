# Opens or updates the PR of the pushed branch. Two kinds, by the branch:
#
#   work PR     a work branch (<type>/<description>) → AUTO_BASE_BRANCH (dev).
#               No issue is created.
#   release PR  AUTO_BASE_BRANCH (dev) → AUTO_RELEASE_BRANCH (main), titled
#               `<type>[!]: release vX.Y.Z` after the release merging it cuts.
#
#   1. Load variables   CI_ROOT (this repo's copy) for the later steps; the
#                       caller's AUTO_* vars, then config/actions.env, then the
#                       branch defaults (scripts/shared-vars.mjs); the PR kind.
#   2. Install git-cliff release PR only: the root package (git-cliff).
#   3. Find or open PR  the branch's open PR, or a new one.
#                       Work PR (work-pr.sh): title = the branch name in the
#                       Conventional shape, "<type>[!]: <description>" (`!`
#                       when a commit is breaking), body = the commit list;
#                       afterwards only a new breaking commit adds the `!`.
#                       Release PR (release-pr.sh): title from
#                       scripts/release-title.mjs, body = the git-cliff
#                       changelog; both follow every push to dev.
#   4. Sync metadata    the label (type label, or `release`; created when
#                       missing), the pusher as assignee, AUTO_MILESTONE_TITLE,
#                       the AUTO_PROJECT_NUMBER board. Each is best-effort: a
#                       failure is a warning, and the PR check then names what
#                       is missing. sync-metadata.sh.
#   5. Describe         Claude Code, headless, reads the branch with git and
#                       writes the description (AUTO_DESCRIBE_MODEL /
#                       AUTO_DESCRIBE_EFFORT) — above the changelog on the
#                       release PR. On every push, so it follows the work;
#                       skipped without an Anthropic API key. describe.sh, with
#                       the prompt in describe-prompt.md or
#                       describe-release-prompt.md.
#
# One PR Checks run per push: only the push, or `github-token` opening the PR,
# starts one, and it waits for this run before checking the PR
# (actions/pr-checks). Every edit here uses GITHUB_TOKEN, whose events start no
# workflow; the board is out of its reach, but is no PR event either.
#
# Needs a full-history checkout of the pushed branch (with tags, for the release
# PR), Node >= 22, and the job env REPO_VARS_JSON (AUTO_BASE_BRANCH and
# AUTO_RELEASE_BRANCH default to dev and main). Used by templates/.github/workflows/auto-pr.yml (onboarded
# repos).
name: Auto PR
description: Open or update the PR of a work branch, or the release PR of dev, with label, assignee, milestone, board and an AI description.
inputs:
  github-token:
    description: Token that opens the PR and adds it to the board. A classic PAT (`repo` + `project`) lets the new PR trigger PR Checks and reach a board owned by a personal account.
    required: true
  anthropic-api-key:
    description: Anthropic API key for the description. Empty keeps the commit list (work PR) or the changelog (release PR) as the description.
    default: ''
outputs:
  url:
    description: The PR's URL, or empty when the branch has nothing to merge yet.
    value: ${{ steps.pr.outputs.url }}
runs:
  using: composite
  steps:
    - name: Load variables
      shell: bash
      run: |
        CI_ROOT="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        echo "CI_ROOT=$CI_ROOT" >> "$GITHUB_ENV"
        node "$CI_ROOT/scripts/shared-vars.mjs"

    # Its own step: the variables above reach the env of the later steps only.
    - name: PR kind
      id: vars
      shell: bash
      run: |
        if [ "$GITHUB_REF_NAME" = "${AUTO_BASE_BRANCH:?}" ]; then kind=release; else kind=work; fi
        echo "kind=$kind" >> "$GITHUB_OUTPUT"

    - name: Install git-cliff
      if: ${{ steps.vars.outputs.kind == 'release' }}
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$CI_ROOT"

    - name: Find or open PR
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EDIT_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        DESCRIBE: ${{ inputs.anthropic-api-key != '' }}
      run: bash "$GITHUB_ACTION_PATH/${{ steps.vars.outputs.kind }}-pr.sh"

    - name: Sync metadata
      if: ${{ steps.pr.outputs.url != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROJECT_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_URL: ${{ steps.pr.outputs.url }}
        PR_LABEL: ${{ steps.pr.outputs.label }}
      run: bash "$GITHUB_ACTION_PATH/sync-metadata.sh"

    - name: Describe
      if: ${{ steps.pr.outputs.url != '' && inputs.anthropic-api-key != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PR_URL: ${{ steps.pr.outputs.url }}
        PR_KIND: ${{ steps.vars.outputs.kind }}
        PR_LABEL: ${{ steps.pr.outputs.label }}
        CHANGELOG: ${{ steps.pr.outputs.changelog }}
        # Pinned: the CLI ships near-daily. Bump deliberately.
        CLAUDE_CODE: '@anthropic-ai/claude-code@2.1.299'
      run: bash "$GITHUB_ACTION_PATH/describe.sh"
