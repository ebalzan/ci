# Computes the next semver from Conventional Commit history, bumps the CALLER's
# package.json (+ lock), commits "chore(release): X.Y.Z", tags vX.Y.Z, pushes,
# and creates the GitHub Release. Needs a full-history checkout of the caller
# with a git identity configured, and GITHUB_TOKEN in the env.
name: Release
description: Version, tag and publish a GitHub Release for the checked-out main.
outputs:
  tag:
    description: The new vX.Y.Z tag, or empty when nothing was released.
    value: ${{ steps.refs.outputs.tag }}
  sha:
    description: The commit the tag points at (the release commit).
    value: ${{ steps.refs.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Create release
      shell: sh
      env:
        CI_ROOT: ${{ github.action_path }}/../..
      run: node "$CI_ROOT/scripts/release/release-main.mjs"

    - name: Capture release refs
      id: refs
      shell: sh
      run: |
        echo "tag=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
