# =============================================================================
# Promote dev → main (reusable) — keeps a single evergreen promotion PR open.
#
# The caller triggers this on every push to dev. It opens (or updates) the
# dev → main PR via scripts/release/promote-dev-to-main.mjs. Merging that PR is
# the production release trigger (release.yml) — and, on the free GitHub plan
# where required-reviewer environment rules are unavailable, it IS the deploy
# approval gate. Review it accordingly.
#
# The PR is opened ready for review and added to the same Projects (v2) board
# as auto-work-items (AUTO_PROJECT_NUMBER / AUTO_PROJECT_OWNER). It is assigned
# to whoever pushed to dev, labelled with `release` plus the type of every
# promoted commit, and put on the AUTO_MILESTONE_TITLE milestone.
#
# GH_PROJECT_TOKEN (classic PAT): lets the opened PR trigger PR Checks, and its
# `project` scope lets it write to the board; the default GITHUB_TOKEN can do
# neither. Falls back to GITHUB_TOKEN when absent.
#
# Caller must grant: contents: read, issues: write, pull-requests: write.
# =============================================================================
name: Promote dev to main

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
    secrets:
      GH_PROJECT_TOKEN:
        required: false

jobs:
  promote:
    name: Open or update dev to main PR
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ebalzan/tracebim-ci/actions/promote@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          # TRANSITIONAL — remove once v1 includes applyRepoVars (the release after 1.2.0).
          # tracebim-ci's self-* callers run this workflow at the pushed commit but the
          # action at v1, whose loader ignores REPO_VARS_JSON. A job-env value wins over
          # REPO_VARS_JSON, so this is harmless after the release.
          AUTO_PROJECT_NUMBER: ${{ vars.AUTO_PROJECT_NUMBER }}
          PROMOTION_ASSIGNEE: ${{ github.actor }}
