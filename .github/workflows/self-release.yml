# =============================================================================
# Release — this repo's own: when the dev → main release PR is merged (with a
# merge commit), release it and ship it to the repos.
#
#   1. release:    actions/release, by LOCAL path (./actions/release): tags
#                  vX.Y.Z, bumps package.json in a `chore(release): X.Y.Z`
#                  commit, publishes the GitHub Release, brings dev up to main.
#                  Not the reusable release.yml: it names
#                  ebalzan/ci/actions/release@vN, which does not exist before
#                  the first vN release — this job is what creates it.
#   2. major-tag:  force-moves the major tag (v4 for v4.2.0) to the release.
#                  Every repo pins @v4, so this is the step that ships the
#                  change to them; vX.Y.Z stays put for rollback.
#   3. npm:        publishes the release to npm as @ebalzan/ci, when the repo
#                  variable NPM_PUBLISH is 'true'. Auth is npm trusted
#                  publishing (OIDC, no token).
#
# A breaking change releases vN+1.0.0 and creates that major tag without
# touching the old one, so repos on the old major are unaffected. The internal
# action refs still name the old major then; major-tag warns, and a follow-up PR
# switching them releases a patch with the refs consistent.
#
# Rollback: git tag -f v4 v4.1.0 && git push -f origin v4
# =============================================================================
name: Release

on:
  pull_request:
    types: [closed]
    branches: ['main']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Version, tag and publish
    # The guard of .github/workflows/release.yml.
    if: >-
      ${{ github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'dev'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      AUTO_BASE_BRANCH: dev
      AUTO_RELEASE_BRANCH: main
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        uses: ./actions/release
        with:
          dev-token: ${{ secrets.GH_PROJECT_TOKEN }}

  major-tag:
    name: Move the major tag
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Point the major tag at the release
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$SHA"
          git push -f origin "refs/tags/$major"
          echo "$major → $TAG ($SHA)"

          # The reusable workflows reach their actions as
          # <this repo>/actions/<name>@vN; at the new major they must say @$major.
          stale="$(grep -rnoE "${GITHUB_REPOSITORY}/[^@[:space:]]+@v[0-9]+" .github/workflows | grep -v "@${major}\$" || true)"
          if [ -n "$stale" ]; then
            echo "::warning::$major was created, but the internal action refs do not say @$major yet. Open a PR changing them to @$major (it releases a patch with consistent refs) before moving any repo to @$major:"
            echo "$stale"
          fi

  npm:
    name: Publish to npm
    needs: release
    if: ${{ vars.NPM_PUBLISH == 'true' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. The package ships its files as
      # committed (no build step), so there is nothing to install first.
      - run: npm install -g npm@^11.5.1

      - name: Publish
        run: npm publish --access public
