# =============================================================================
# Promote dev → main — this repo's own evergreen promotion PR.
#
# Thin caller of the reusable promote-dev-to-main.yml by local path. Merging
# the PR it opens releases this repo (self-release.yml), which moves the
# major tag every repo pins — so merging it ships the change to every repo.
# Review it accordingly.
# =============================================================================
name: Promote dev to main

on:
  push:
    branches: ['dev']
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  promote:
    uses: ./.github/workflows/promote-dev-to-main.yml
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
