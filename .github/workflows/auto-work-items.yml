# =============================================================================
# Auto Create Work Items (reusable) — project-board automation for feature
# branches.
#
# The caller triggers this on every push to a non-main/non-dev branch; it
# creates or updates the tracking issue + PR + Projects (v2) metadata for that
# branch (actions/auto-work-items). Purely dev-side tooling: it never touches
# builds, releases, or deployments.
#
# Every AUTO_* knob the script reads is wired below from `vars`, which in a
# reusable workflow are the CALLER repo's variables — only the repo's own keys.
# An unset variable arrives empty; the action fills it from config/actions.env
# at the same ref (shared values), else its code default applies. So any repo
# can set or override any knob without touching this file.
#
# Secrets are passed explicitly by the caller (not `secrets: inherit`, which is
# only guaranteed within one organization/enterprise):
#   ANTHROPIC_API_KEY   describes the issue/PR (optional: falls back to a stub)
#   GH_PROJECT_TOKEN    classic PAT, `project` + `repo` scopes. A fine-grained
#                       PAT cannot reach a board owned by a personal account.
#                       Falls back to GITHUB_TOKEN (no board writes then).
# See docs/AUTO_WORK_ITEMS_WORKFLOW.md.
#
# Caller must grant: contents: read, issues: write, pull-requests: write,
# repository-projects: write.
# =============================================================================
name: Auto Create Work Items

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
      base-branch:
        description: Branch the feature PR targets.
        type: string
        default: dev
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      GH_PROJECT_TOKEN:
        required: false

jobs:
  create-and-sync-work-items:
    name: Create and sync work items
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      repository-projects: write
    concurrency:
      group: auto-work-items-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTO_BASE_BRANCH: ${{ inputs.base-branch }}
      AUTO_PROJECT_NUMBER: ${{ vars.AUTO_PROJECT_NUMBER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Same tag as this workflow's: bump both together (see README "Releasing").
      - uses: ebalzan/tracebim-ci/actions/auto-work-items@v1
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
