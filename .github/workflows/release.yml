# =============================================================================
# Release (reusable) — every push to main becomes a versioned release.
#
#   1. release:  actions/release computes the next semver from Conventional
#                Commit history, bumps package.json, commits
#                "chore(release): X.Y.Z", tags vX.Y.Z and creates the GitHub
#                Release. (The `if:` guard stops the run that commit triggers
#                from releasing again.)
#   2. sync-dev: points dev at the release commit (see below).
#
# What happens AFTER the release — an image + EC2 rollout, a Vercel deploy, an
# EAS build or OTA update — is repo-specific: the caller chains its own jobs on
# this workflow's outputs:
#
#   jobs:
#     release:
#       uses: ebalzan/tracebim-ci/.github/workflows/release.yml@v1
#     deploy:
#       needs: release
#       if: ${{ needs.release.outputs.tag != '' }}
#       ...  needs.release.outputs.tag / needs.release.outputs.sha
#
# `tag` is empty when nothing was released (the release commit's own run).
#
# Caller must grant: contents: write, pull-requests: read (plus whatever its
# own deploy jobs need, e.g. packages: write, id-token: write).
# =============================================================================
name: Release

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the jobs.
        type: string
        default: ubuntu-latest
      sync-dev:
        description: Point dev at the release commit after releasing.
        type: boolean
        default: true
    outputs:
      tag:
        description: The new vX.Y.Z tag, or empty when nothing was released.
        value: ${{ jobs.release.outputs.tag }}
      sha:
        description: The release commit.
        value: ${{ jobs.release.outputs.sha }}

jobs:
  release:
    name: Version, tag and publish
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: release
        uses: ebalzan/tracebim-ci/actions/release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Promoting dev -> main rewrites the promoted commits: squash collapses them
  # into one new commit, rebase replays them under new SHAs. Either way dev and
  # main end up with identical CONTENT under unrelated HISTORY. The next
  # promotion would then re-merge everything from the last common ancestor and
  # conflict against itself, file by file — which is exactly what happened twice
  # before this job existed.
  #
  # main now contains everything dev had plus the release commit, so pointing
  # dev at main loses nothing: dev adopts the history just published. Pushes
  # made with GITHUB_TOKEN do not trigger workflows, so this cannot loop back
  # into promote-dev-to-main.
  sync-dev:
    name: Point dev at the release commit
    needs: release
    if: ${{ inputs.sync-dev && needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force-sync dev to main
        run: |
          git fetch origin main dev
          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"

          if [ "$main_sha" = "$dev_sha" ]; then
            echo "dev already matches main ($main_sha); nothing to do."
            exit 0
          fi

          # --force-with-lease so a dev push that landed while this job was
          # running aborts the sync instead of silently discarding it.
          echo "Pointing dev at ${main_sha} (was ${dev_sha})"
          git push --force-with-lease=dev:"$dev_sha" origin "${main_sha}:refs/heads/dev"
