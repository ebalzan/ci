# =============================================================================
# Work PR (reusable) — the check every feat/fix/… PR must pass before it is
# squash-merged into dev (actions/work-pr):
#
#   - the title and every commit are Conventional Commits (commitlint);
#   - the PR's data (Danger): base is dev, branch is <type>/<description>,
#     title type = branch type, exactly that type label, an assignee, an
#     author who is the owner/a member/a collaborator, the AUTO_MILESTONE_TITLE
#     milestone and the AUTO_PROJECT_NUMBER board when set, a description.
#
# Release PRs (head = dev) are not work PRs: the job is skipped for them, as for
# drafts (the check runs once the PR is marked ready). A skipped job counts as
# passed for a required check, so `work-pr / Work PR` can be required on main
# and dev alike.
#
# Call it from a job named `work-pr` so the check is reported as
# `work-pr / Work PR`, the name the shared rulesets (config/rulesets/) require.
# The repo's own build/test jobs stay next to the call in its pr-checks.yml.
#
# GH_PROJECT_TOKEN (classic PAT, `project` scope) is needed only to check the
# board when it is owned by a personal account; fork PRs never receive it.
#
# Caller must grant: contents: read, pull-requests: write (Danger's comment).
# =============================================================================
name: Work PR

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
      base-branch:
        description: Branch work PRs target; PRs whose head is this branch are release PRs.
        type: string
        default: dev
    secrets:
      GH_PROJECT_TOKEN:
        required: false

jobs:
  work-pr:
    name: Work PR
    if: ${{ github.event.pull_request.head.ref != inputs.base-branch && !github.event.pull_request.draft }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
    env:
      AUTO_BASE_BRANCH: ${{ inputs.base-branch }}
      REPO_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same major as this workflow's: bump both together.
      - uses: ebalzan/ci/actions/work-pr@v4
        with:
          project-token: ${{ secrets.GH_PROJECT_TOKEN }}
