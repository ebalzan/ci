# =============================================================================
# CI — this repo's own checks (not reusable).
#
# dist/ is committed because callers run it straight from the action download,
# with no build step — so the check that matters is "dist matches src".
# Shell and Node scripts get a syntax pass; the workflows themselves are only
# exercised for real once a tag is used by a caller.
# =============================================================================
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build, verify dist is committed, syntax-check scripts
        run: npm run check
