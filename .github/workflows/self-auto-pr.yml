# =============================================================================
# Auto Create Work Items — tracebim-ci's own feature branches.
#
# Same as every repo's auto-pr.yml, except it calls the reusable workflow by
# LOCAL path (./), so the workflow file runs at the pushed commit. The actions
# that workflow uses are still pinned to @v1 — the last release — so a change
# to an action cannot break the pipeline that ships it (README → Releasing).
# Every AUTO_* knob is a repository variable: config/actions.env merged with
# .github/actions.env by `npm run gh:bootstrap`.
# =============================================================================
name: Auto Create Work Items

on:
  push:
    branches-ignore:
      - main
      - dev
    tags-ignore:
      - '**'

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  work-items:
    uses: ./.github/workflows/auto-work-items.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
