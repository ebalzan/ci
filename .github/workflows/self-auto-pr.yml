# =============================================================================
# Auto PR — this repo's own: the PR of every work branch, and the release PR of
# dev. Same job as the reusable auto-pr.yml, except the action is used by LOCAL
# path (./actions/auto-pr), at the pushed commit. The reusable workflow names
# ebalzan/ci/actions/auto-pr@vN, which does not exist before the first vN
# release (see self-release.yml), so this repo cannot call it on itself.
#
# AUTO_* knobs: .github/actions.env (repository variables, pushed by
# `npm run gh:sync`), then config/actions.env at the pushed commit.
# =============================================================================
name: Auto PR

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Open or update PR
    # Renovate opens and rewrites its own PR on these branches.
    if: ${{ !startsWith(github.ref_name, 'chore/renovate-') }}
    runs-on: ubuntu-latest
    # Queued, never cancelled: a run cut short could leave its new PR in draft.
    concurrency:
      group: auto-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      AUTO_BASE_BRANCH: dev
      AUTO_RELEASE_BRANCH: main
      REPO_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      # Full history with the tags: the release PR's version comes from them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./actions/auto-pr
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
