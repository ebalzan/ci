# =============================================================================
# Auto PR (reusable) — the PR of every work branch, and the release PR of dev.
#
# The caller triggers this on every push to a branch other than main
# (actions/auto-pr):
#   - a work branch: opens (or updates) its PR into dev, as a draft until its
#     type label, assignee, milestone, board card and AI description are in
#     place. No issue is created.
#   - dev: opens (or updates) THE release PR, dev → main, titled after the
#     release merging it cuts (`feat: release v1.4.0`), with the `release`
#     label, the same assignee/milestone/board, and an AI summary above the
#     git-cliff changelog.
# It never builds, releases or deploys anything itself.
#
# The CALLER repo's variables (`vars`, in a reusable workflow) are passed whole
# as REPO_VARS_JSON; the action takes their AUTO_* keys. Any knob the repo
# leaves unset is filled from config/actions.env at the same ref (shared
# values), else its code default applies. So any repo can set or override any
# knob — including ones added later — without touching this file.
#
# Secrets are passed explicitly by the caller (not `secrets: inherit`, which is
# only guaranteed within one organization/enterprise):
#   ANTHROPIC_API_KEY   writes the PR description (optional: without it the
#                       commit list stays as the description)
#   GH_PROJECT_TOKEN    classic PAT, `project` + `repo` scopes. Makes the PR's
#                       events trigger PR Checks, and reaches a board owned by a
#                       personal account (a fine-grained PAT cannot). Falls back
#                       to GITHUB_TOKEN: no board, and PR Checks wait for the
#                       next push (the release PR: until someone pushes to it).
#
# Renovate's branches (chore/renovate-*) are skipped: Renovate opens and
# rewrites its own PR.
#
# Caller must grant: contents: read, pull-requests: write.
# =============================================================================
name: Auto PR

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
      base-branch:
        description: Branch work PRs target; a push to it updates the release PR.
        type: string
        default: dev
      release-branch:
        description: Branch the release PR targets.
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      GH_PROJECT_TOKEN:
        required: false

jobs:
  auto-pr:
    name: Open or update PR
    # Renovate opens and rewrites its own PR on these branches (renovate/tooling.json
    # → branchPrefix); syncing them here would overwrite its title and body.
    if: ${{ !startsWith(github.ref_name, 'chore/renovate-') }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
    # Queued, never cancelled: a run cut short could leave its new PR in draft.
    concurrency:
      group: auto-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      AUTO_BASE_BRANCH: ${{ inputs.base-branch }}
      AUTO_RELEASE_BRANCH: ${{ inputs.release-branch }}
      REPO_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      # Full history with the tags: the release PR's version comes from them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same major as this workflow's: bump both together.
      - uses: ebalzan/ci/actions/auto-pr@v4
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
