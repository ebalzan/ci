# =============================================================================
# PR Title (reusable) — the shared part of every repo's PR Checks.
#
# The PR title becomes the squash commit that drives the semver release, so it
# must be a Conventional Commit subject and its type must match the release
# type the branch prefix implies (feat/ → minor, fix/ → patch, …).
#
# It also fails when the repo keeps a (deprecated) local copy of a managed/
# file that has drifted from this version.
#
# The repo's own build/test jobs stay in its pr-checks.yml next to the call;
# they run in parallel with this one. Call it from a job named `title` so the
# check is reported as `title / Validate PR Title`, the name the shared
# rulesets (config/rulesets/) require.
#
# Caller must grant: contents: read.
# =============================================================================
name: PR Title

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      # Only the managed paths are needed (for the drift check); the validators
      # themselves come with the action and run on the runner's own Node.
      - name: Checkout managed files
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: true

      - uses: ebalzan/ci/actions/pr-title@v1
        with:
          title: ${{ github.event.pull_request.title }}
          head-ref: ${{ github.event.pull_request.head.ref }}
