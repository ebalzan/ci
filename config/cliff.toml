# git-cliff (https://git-cliff.org): the next version and the changelog of the
# release PR, from the Conventional Commits on dev since the last vX.Y.Z tag.
# Read by scripts/release-title.mjs (the title) and actions/auto-pr (the body);
# actions/pr-check recomputes the title with it.
#
# The bump matches config/types.json: feat → minor, `!` or a BREAKING CHANGE
# footer → major (from 0.x too), every other type → patch. A repo with no tag
# yet starts at v0.1.0 (initial_tag).

[changelog]
# One `### <type>` section per type, feat first, the others alphabetically.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Merge commits and git's own subjects (Revert "…") are not releases.
filter_unconventional = true
protect_breaking_commits = true
# Only vX.Y.Z: the moving major tags (v4) would otherwise end the range.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat[(!:]", group = "<!-- 0 -->feat" },
  { message = "^(\\w+)", group = "$1" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
