# git-cliff (https://git-cliff.org): the next version and the changelog of the
# release PR, from the Conventional Commits on dev since the last vX.Y.Z tag.
# Read by scripts/release-title.mjs (the title) and actions/auto-pr (the body);
# actions/pr-checks recomputes the title with it, actions/release recomputes it
# on main and falls back to it for the GitHub Release notes.
#
# Which types bump minor is NOT set here: config/types.json's `release` is the
# one place, and scripts/changelog.mjs (the only caller) passes its minor types
# as GIT_CLIFF__BUMP__CUSTOM_MINOR_INCREMENT_REGEX. Run git-cliff through it,
# not directly. Set here: `!` or a BREAKING CHANGE footer → major (from 0.x
# too), any other type → patch, and a repo with no tag yet starts at v0.1.0.

[changelog]
# One `### <type>` section per type, feat first, the others alphabetically.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Merge commits and git's own subjects (Revert "…") are not releases. History
# is linear (main fast-forwards to dev), but a merge that slipped in is skipped.
filter_unconventional = true
protect_breaking_commits = true
# Only vX.Y.Z: the moving major tags (v1) would otherwise end the range.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat[(!:]", group = "<!-- 0 -->feat" },
  { message = "^(\\w+)", group = "$1" },
]

[bump]
# git-cliff's own feat rule, kept for 0.x; types.json must list feat as minor.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
